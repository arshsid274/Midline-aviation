name: Deploy to Vercel (production)

# Reliable push -> production deploy, independent of Vercel's native Git webhook
# (which stopped auto-firing). Requires three GitHub repo secrets:
#   VERCEL_TOKEN       -> create at https://vercel.com/account/tokens
#   VERCEL_ORG_ID      -> team_xx4Mkgf1oSkbHuxIMYLMw8oA
#   VERCEL_PROJECT_ID  -> prj_7aAGpJFdkavLICz3LhqBSuymxSLV
# Add them under: GitHub repo -> Settings -> Secrets and variables -> Actions.

on:
  push:
    branches: [master]
  workflow_dispatch: {} # allows manual "Run workflow" from the Actions tab

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      # Pulls the project's Production env vars + settings from Vercel so the
      # build uses the exact same config as a native deploy (SMTP, GROQ, etc.).
      - name: Pull Vercel environment
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy prebuilt to production
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
